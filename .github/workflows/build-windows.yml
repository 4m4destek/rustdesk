name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          .\bootstrap-vcpkg.bat
          $env:VCPKG_ROOT = "$PWD"
          $env:VCPKG_ROOT | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Download sciter.dll
        run: |
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll" -OutFile target\release\sciter.dll

      - name: Build
        run: |
          $env:VCPKG_ROOT = "$PWD\vcpkg"
          cargo build --release

      - name: Rename
        run: |
          Copy-Item target\release\rustdesk.exe "4m4bilisim.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: 4m4bilisim-windows
          path: |
            4m4bilisim.exe
            target\release\sciter.dll   
