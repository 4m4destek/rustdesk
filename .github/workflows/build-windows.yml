name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          $pkgs = @('libvpx:x64-windows-static','libyuv:x64-windows-static','opus:x64-windows-static','aom:x64-windows-static')
          & "$env:USERPROFILE\vcpkg\vcpkg.exe" install $pkgs

      - name: Download Sciter DLL
        run: |
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll" -OutFile target\release\sciter.dll

      - name: Build
        shell: bash
        env:
          VCPKG_ROOT: D:/a/rustdesk/rustdesk/vcpkg
        run: |
          python3 res/inline-sciter.py
          cargo build --locked --features inline,vram,hwcodec --release --bins

      - name: Rename
        run: |
          Copy-Item target\release\rustdesk.exe "4m4bilisim.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: 4m4bilisim-windows
          path: |
            4m4bilisim.exe
            target\release\sciter.dll   
