name: Build RustDesk Windows x64

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Setup LLVM
        run: |
          choco install -y llvm --allow-downgrade
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg $env:USERPROFILE\vcpkg
          & $env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:USERPROFILE\vcpkg\installed\x64-windows-static\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install dependencies
        run: |
          & $env:USERPROFILE\vcpkg\vcpkg.exe install --triplet x64-windows-static

      - name: Download Sciter
        run: |
          New-Item -ItemType Directory -Force -Path target\release
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll" -OutFile target\release\sciter.dll

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: |
            target\x86_64-pc-windows-msvc\release\rustdesk.exe
            target\release\sciter.dll   
